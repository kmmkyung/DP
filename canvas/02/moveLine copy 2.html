<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Waves Canvas</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        overflow-x: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas1" class="canvas1"></canvas>
    <canvas id="canvas2" class="canvas2"></canvas>
    <canvas id="canvas3" class="canvas3"></canvas>
    <canvas id="canvas4" class="canvas4"></canvas>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const pi = Math.PI;
        const pi2 = pi * 2;

        // 캔버스별 프리셋: 색상(bgColors) + 라인 위치(waveCurveLeft, Right, Bulge, waveOffset)
        const presets = [
          {
            // 1. 로봇 SI
            waves: 4,
            width: 500,
            amplitude: 0.45,
            speed: [0.004, 0.008],
            bgColors: ["#0A1327", "#141F3D", "#187F97", "#153B56"],
            bgAlpha: 0.95,
            bgCycleMs: 12000,
            waveCurveLeft: 1,
            waveCurveRight: 0,
            waveCurveBulge: 0.6,
            waveOffset: 0.8,
          },
          {
            // 2. 모빌리티 드론
            waves: 4,
            width: 500,
            amplitude: 0.4,
            speed: [0.003, 0.007],
            bgColors: ["#0F1F41", "#1D496D", "#1F4F87", "#0F172F"],
            bgAlpha: 0.95,
            bgCycleMs: 14000,
            waveCurveLeft: 0.9,
            waveCurveRight: 0.1,
            waveCurveBulge: 0.55,
            waveOffset: 0.65,
          },
          {
            // 3. 스마트팩토리
            waves: 4,
            width: 500,
            amplitude: 0.42,
            speed: [0.005, 0.009],
            bgColors: ["#091939", "#142C5D", "#427EA7", "#133166"],
            bgAlpha: 0.95,
            bgCycleMs: 13000,
            waveCurveLeft: 0.75,
            waveCurveRight: 0.25,
            waveCurveBulge: 0.5,
            waveOffset: 0.7,
          },
          {
            // 4. 메디컬 로봇
            waves: 4,
            width: 500,
            amplitude: 0.38,
            speed: [0.004, 0.008],
            bgColors: ["#011E3C", "#135280", "#001B3A", "#001738"],
            bgAlpha: 0.95,
            bgCycleMs: 15000,
            waveCurveLeft: 0.85,
            waveCurveRight: 0.15,
            waveCurveBulge: 0.45,
            waveOffset: 0.55,
          },
        ];

        function clamp01(n) {
          return Math.min(1, Math.max(0, n));
        }
        function lerp(a, b, t) {
          return a + (b - a) * t;
        }
        function hexToRgb(hex) {
          const h = String(hex).trim().replace(/^#/, "");
          const normalized =
            h.length === 3 ? `${h[0]}${h[0]}${h[1]}${h[1]}${h[2]}${h[2]}` : h;
          if (!/^[0-9a-fA-F]{6}$/.test(normalized)) return {r: 0, g: 0, b: 0};
          const n = parseInt(normalized, 16);
          return {r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255};
        }
        function mixColor(c1, c2, t) {
          const tt = clamp01(t);
          return {
            r: Math.round(lerp(c1.r, c2.r, tt)),
            g: Math.round(lerp(c1.g, c2.g, tt)),
            b: Math.round(lerp(c1.b, c2.b, tt)),
          };
        }
        function rnd(a, b) {
          if (b === undefined) return Math.random() * a;
          return a + Math.random() * (b - a);
        }
        function rndSign() {
          return Math.random() > 0.5 ? 1 : -1;
        }

        const scale = window.devicePixelRatio || 1;
        const instances = [];

        function createWave(options) {
          const o = options;
          return {
            lines: [],
            angle: [rnd(pi2), rnd(pi2), rnd(pi2), rnd(pi2)],
            speed: [
              rnd(...o.speed) * rndSign(),
              rnd(...o.speed) * rndSign(),
              rnd(...o.speed) * rndSign(),
              rnd(...o.speed) * rndSign(),
            ],
          };
        }
        function createLine(wave, color) {
          return {
            angle: [
              Math.sin((wave.angle[0] += wave.speed[0])),
              Math.sin((wave.angle[1] += wave.speed[1])),
              Math.sin((wave.angle[2] += wave.speed[2])),
              Math.sin((wave.angle[3] += wave.speed[3])),
            ],
            color: color,
          };
        }
        function updateColor(deltaMs, state) {
          const options = state.options;
          const safeDelta = Number.isFinite(deltaMs) ? Math.max(0, deltaMs) : 0;
          state.colorElapsedMs =
            (state.colorElapsedMs + safeDelta) % options.bgCycleMs;
          const count = Math.max(3, state.palette.length);
          const progress = (state.colorElapsedMs / options.bgCycleMs) * count;
          const idx = Math.floor(progress) % count;
          const t = progress - Math.floor(progress);
          const c1 = state.palette[idx % state.palette.length];
          const c2 = state.palette[(idx + 1) % state.palette.length];
          const mixed = mixColor(c1, c2, t);
          return `rgba(${mixed.r},${mixed.g},${mixed.b},${options.bgAlpha})`;
        }
        function drawWave(ctx, wave, W, H, options) {
          const y0 = H * options.waveCurveLeft;
          const y2 = H * options.waveCurveRight;
          const y1 = y2 + H * options.waveCurveBulge;
          function curveY(t) {
            const tt = clamp01(t);
            const mt = 1 - tt;
            return mt * mt * y0 + 2 * mt * tt * y1 + tt * tt * y2;
          }
          function curveDyDt(t) {
            const tt = clamp01(t);
            return 2 * (1 - tt) * (y1 - y0) + 2 * tt * (y2 - y1);
          }
          function curveNormal(t) {
            const dy = curveDyDt(t);
            const dx = W;
            const len = Math.hypot(-dy, dx) || 1;
            return {x: -dy / len, y: dx / len};
          }
          const baseOffset =
            Math.min(W, H) * options.waveOffset * options.amplitude;
          const t0 = 0,
            t1 = 1 / 3,
            t2 = 2 / 3,
            t3 = 1;
          const n0 = curveNormal(t0),
            n1 = curveNormal(t1),
            n2 = curveNormal(t2),
            n3 = curveNormal(t3);

          wave.lines.forEach((line) => {
            const a = line.angle;
            const x1 = 0 + n0.x * (a[0] * baseOffset * 1.5);
            const y1p = curveY(t0) + n0.y * (a[0] * baseOffset * 1.5);
            const x2 = W + n3.x * (a[3] * baseOffset * 1.5);
            const y2p = curveY(t3) + n3.y * (a[3] * baseOffset * 1.5);
            const cpx1 = W * t1 + n1.x * (a[1] * baseOffset * 1.35);
            const cpy1 = curveY(t1) + n1.y * (a[1] * baseOffset * 1.35);
            const cpx2 = W * t2 + n2.x * (a[2] * baseOffset * 1.35);
            const cpy2 = curveY(t2) + n2.y * (a[2] * baseOffset * 1.35);
            ctx.strokeStyle = line.color;
            ctx.beginPath();
            ctx.moveTo(x1, y1p);
            ctx.bezierCurveTo(cpx1, cpy1, cpx2, cpy2, x2, y2p);
            ctx.stroke();
          });
        }
        function background(ctx, W, H, color, preset) {
          const base =
            preset && preset.bgColors && preset.bgColors[0]
              ? preset.bgColors[0]
              : "#0a1327";
          const gradient = ctx.createLinearGradient(0, 0, W, H);
          gradient.addColorStop(0, base);
          gradient.addColorStop(1, color);
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, W, H);
        }

        ["canvas1", "canvas2", "canvas3", "canvas4"].forEach((id, index) => {
          const canvas = document.getElementById(id);
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          const options = presets[index] || presets[0];
          const palette = options.bgColors.map(hexToRgb);
          const waves = [];
          for (let i = 0; i < options.waves; i++)
            waves.push(createWave(options));
          const state = {
            canvas,
            ctx,
            options,
            palette,
            waves,
            colorElapsedMs: 0,
            visible: true,
            W: 0,
            H: 0,
          };
          function resize() {
            state.W = window.innerWidth;
            state.H = window.innerHeight;
            canvas.width = state.W * scale;
            canvas.height = state.H * scale;
            canvas.style.width = state.W + "px";
            canvas.style.height = state.H + "px";
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
          }
          resize();
          instances.push({state, resize});
        });

        window.addEventListener("resize", function () {
          instances.forEach((inst) => inst.resize());
        });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const inst = instances.find(
                (i) => i.state.canvas === entry.target,
              );
              if (inst) inst.state.visible = entry.isIntersecting;
            });
          },
          {rootMargin: "20%", threshold: 0},
        );
        instances.forEach((inst) => observer.observe(inst.state.canvas));

        let lastTs = 0;
        const MOBILE_BREAKPOINT = 812;

        function animate(ts) {
          const deltaMs = lastTs ? ts - lastTs : 16.67;
          lastTs = ts;
          instances.forEach(({state}) => {
            if (!state.visible) return;
            const {ctx, options, waves, W, H} = state;
            if (!W || !H) return;
            const waveCount = W <= MOBILE_BREAKPOINT ? 1 : options.waves;
            const color = updateColor(deltaMs, state);
            ctx.clearRect(0, 0, W, H);
            background(ctx, W, H, color, options);
            waves.slice(0, waveCount).forEach((w) => {
              w.lines.push(createLine(w, color));
              if (w.lines.length > options.width) w.lines.shift();
              drawWave(ctx, w, W, H, options);
            });
          });
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
