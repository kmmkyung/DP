<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그 원고 생성기</title>
  </head>
  <body>
    <main>
      <section>
        <h1>블로그 원고 생성기</h1>
        <p class="desc">
          제작한 홈페이지 주소를 넣으면 홍보 원고와 PC 화면 캡처를 만들어
          드립니다.
        </p>

        <div class="card">
          <form id="form">
            <input
              type="text"
              id="url"
              placeholder="예) http://design.com"
              autocomplete="off"
              required />
            <select id="maxPages" title="캡처할 페이지 수 (메인 포함)">
              <option value="5">페이지 5개</option>
              <option value="8" selected>페이지 8개</option>
              <option value="12">페이지 12개</option>
            </select>
            <button type="submit" class="primary" id="go">원고 만들기</button>
          </form>
          <div class="status" id="status"></div>
        </div>

        <section class="result" id="result">
          <div class="card">
            <div class="toolbar">
              <button type="button" id="copyText">원고 텍스트 복사</button>
              <a id="zipLink"
                ><button type="button">
                  이미지+원고 전체 다운로드(ZIP)
                </button></a
              >
              <span class="todo" id="todo"></span>
            </div>
            <div class="post" id="post"></div>
          </div>
          <aside id="info"></aside>
        </section>
      </section>
      <div class="toast" id="toast"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let current = null;

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1500);
      }

      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          // http 환경 등에서 clipboard API가 막힌 경우 대비
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        toast("복사했습니다");
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = $("status");
        $("go").disabled = true;
        status.className = "status";
        status.textContent =
          "사이트를 열고 페이지별로 캡처하는 중입니다… 보통 1~2분 걸려요.";
        $("result").classList.remove("show");
        const started = Date.now();
        const timer = setInterval(() => {
          status.textContent = `사이트를 열고 페이지별로 캡처하는 중입니다… (${Math.round((Date.now() - started) / 1000)}초)`;
        }, 1000);
        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              url: $("url").value,
              maxPages: $("maxPages").value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "알 수 없는 오류");
          current = data;
          render(data);
          status.textContent = `완료! 결과 폴더: output/${data.id}`;
        } catch (err) {
          status.className = "status error";
          status.textContent = err.message;
        } finally {
          clearInterval(timer);
          $("go").disabled = false;
        }
      });

      function render({id, site, manuscript}) {
        const img = (f) =>
          `/output/${encodeURIComponent(id)}/${encodeURIComponent(f)}`;
        let n = 0;
        $("post").innerHTML = manuscript.blocks
          .map((b) => {
            if (b.type === "image") {
              n++;
              return `<figure>
        <img src="${img(b.file)}" alt="${esc(b.caption)}" loading="lazy">
        <figcaption><span class="num">이미지 ${n}</span> ${esc(b.caption)}
          · <a href="${img(b.file)}" download>첫 화면 저장</a>
          · <a href="${img(b.fullFile)}" target="_blank" rel="noopener">전체 페이지 보기</a></figcaption>
      </figure>`;
            }
            return `<p class="t">${esc(b.text).replace(/【[^】]*】/g, (m) => `<mark>${m}</mark>`)}</p>`;
          })
          .join("");

        const todos = (manuscript.text.match(/【[^】]*】/g) || []).length;
        $("todo").textContent = todos
          ? `노란색 【 】 ${todos}곳을 직접 채워 주세요`
          : "";
        $("zipLink").href = `/zip/${encodeURIComponent(id)}`;

        const slogans =
          site.sloganCandidates
            .map(
              (s) =>
                `<button type="button" class="chip" data-copy="${esc(s.text)}">${esc(s.text)} <small>(${s.fontSize}px)</small></button>`,
            )
            .join("") || '<p class="err">찾지 못했습니다</p>';
        const colors = site.colors.accents
          .map(
            (c) =>
              `<span class="swatch"><i style="background:${esc(c)}"></i>${esc(c)}</span>`,
          )
          .join("");
        const menu = site.pages
          .filter((p) => !p.isHome)
          .map(
            (p) =>
              `<li>${esc(p.name)}${p.subs.length ? ` <small>(${esc(p.subs.join(", "))})</small>` : ""}${p.error ? ` <span class="err">캡처 실패: ${esc(p.error)}</span>` : ""}</li>`,
          )
          .join("");
        const pageTexts = site.pages
          .filter((p) => !p.error)
          .map(
            (p) =>
              `<details><summary>${esc(p.name)}</summary>${[...p.headings, ...p.paragraphs].map((t) => `<p>${esc(t)}</p>`).join("") || "<p>추출된 문구 없음</p>"}</details>`,
          )
          .join("");

        $("info").innerHTML = `
    <div class="card"><h3>고객사명 (추정)</h3><button type="button" class="chip" data-copy="${esc(manuscript.clientName)}">${esc(manuscript.clientName)}</button>
      <small style="color:var(--sub)">틀리면 원고에서 직접 고쳐 주세요</small></div>
    <div class="card"><h3>슬로건 후보 (클릭하면 복사)</h3>${slogans}</div>
    <div class="card"><h3>포인트 컬러 · 서체</h3><div class="swatches">${colors || '<span class="err">찾지 못했습니다</span>'}</div>
      <p style="margin:8px 0 0;font-size:14px">${esc(site.fonts.join(", ") || "서체 정보 없음")}</p></div>
    <div class="card"><h3>메뉴 구성</h3>${menu ? `<ul class="menu">${menu}</ul>` : '<p class="err">메뉴를 찾지 못했습니다. 메인 화면만 캡처했어요.</p>'}</div>
    <div class="card"><h3>페이지별 추출 문구 (원고 다듬을 때 참고)</h3>${pageTexts}</div>`;

        $("result").classList.add("show");
      }

      $("copyText").addEventListener(
        "click",
        () => current && copy(current.manuscript.text),
      );
      $("info").addEventListener("click", (e) => {
        const b = e.target.closest("[data-copy]");
        if (b) copy(b.dataset.copy);
      });
    </script>
  </body>
</html>
