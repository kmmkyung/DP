<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그 원고 생성기</title>
    <!-- [이 파일의 역할] 기획자가 브라우저에서 보는 화면(입력창 + 결과 미리보기) 전체입니다. -->
    <!-- 구성: (1) index.css = 모양(CSS, 아래 link 태그로 불러옴), (2) body = 화면 뼈대(HTML), (3) 맨 아래 script = 동작(JavaScript). -->
    <!-- 서버(server.js)가 주소 / 로 접속한 사람에게 이 파일을, index.css 는 /index.css 요청에 내려줍니다. -->
    <!-- 모양(CSS)은 별도 파일 index.css 로 분리했습니다. -->
    <!-- href 를 "/index.css" 가 아니라 "index.css" 처럼 상대 경로로 적어서, 서버(npm start)로 열어도(주소 /) Live Server 로 열어도(주소 /blog-generator/public/index.html) 같은 폴더의 파일을 찾습니다. -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- main: 이 페이지의 핵심 내용 전체. 문서에서 하나만 둘 수 있고, 낭독기 사용자가 본문으로 바로 이동하는 기준점이 됩니다. 폭을 맞추는 틀(.wrap)은 안쪽 section 이 맡습니다. -->
    <main>
      <section class="wrap" aria-labelledby="h-title">
        <header>
          <h1 id="h-title">블로그 원고 생성기</h1>
          <p class="desc">
            제작한 홈페이지 주소를 넣으면 홍보 원고와 PC 화면 캡처를 만들어
            드립니다.
          </p>
        </header>

        <section class="card" aria-labelledby="h-input">
          <h2 class="sr-only" id="h-input">주소 입력</h2>
          <form id="form">
            <label for="url" class="sr-only">홈페이지 주소</label>
            <input
              type="text"
              id="url"
              placeholder="예) http://design.com"
              autocomplete="off"
              required />
            <label for="maxPages" class="sr-only"
              >캡처할 페이지 수 (메인 포함)</label
            >
            <select id="maxPages" title="캡처할 페이지 수 (메인 포함)">
              <option value="5">페이지 5개</option>
              <option value="8" selected>페이지 8개</option>
              <option value="12">페이지 12개</option>
            </select>
            <button type="submit" class="primary" id="go">원고 만들기</button>
          </form>
          <output class="status" id="status"></output>
        </section>

        <section class="result" id="result" aria-labelledby="h-result">
          <h2 class="sr-only" id="h-result">분석 결과</h2>
          <section class="card" aria-labelledby="h-post">
            <header class="toolbar">
              <h3 class="sr-only" id="h-post">원고 미리보기</h3>
              <menu>
                <li>
                  <button type="button" id="copyText">원고 텍스트 복사</button>
                </li>
                <li>
                  <a id="zipLink" class="btn">이미지+원고 전체 다운로드(ZIP)</a>
                </li>
              </menu>
              <p class="todo" id="todo"></p>
            </header>
            <article class="post" id="post"></article>
          </section>
          <aside id="info" aria-labelledby="h-info"></aside>
        </section>
      </section>
    </main>
    <output class="toast" id="toast"></output>

    <script>
      // ─────────────────────────────────────────────
      // [이 스크립트의 역할] 화면의 "동작"을 담당합니다.
      // 흐름: [원고 만들기] 제출 → 서버에 분석 요청(fetch) → 결과를 받아 render()로 화면에 그림
      // 이 코드는 서버가 아니라 "기획자의 브라우저 안"에서 실행됩니다. (서버 쪽 코드는 server.js)
      // ─────────────────────────────────────────────
      // ─────────────────────────────────────────────
      // [이 파일에서 쓰는 메소드(기본 제공 기능) 설명]
      // 메소드 = 값 뒤에 점(.)을 찍어 부르는 기능입니다.   예) "abc".trim()   (값.기능이름())
      // 설명은 MDN(JavaScript / Web API), Node.js, Playwright 공식 문서로 대조한 내용입니다.
      //
      // ■ 문자열 (String) — 글자 값 뒤에 점을 찍어 쓰는 기능
      //   replace()  — 패턴(글자나 정규식)에 맞는 부분을 다른 글자로 바꾼 새 문자열을 돌려줍니다. 정규식 끝에 g 가 있으면 맞는 부분을 모두, 없으면 처음 하나만 바꿉니다. 원본은 그대로입니다.
      //       예) "a-b-c".replace(/-/g, "_") → "a_b_c"
      //   match()  — 정규식과 맞는 부분을 찾아 돌려줍니다. 하나도 없으면 null 입니다. 정규식에 g 가 있으면 맞는 부분 전부가 배열로 나옵니다.
      //       예) "a1b22".match(/\d+/g) → ["1", "22"]
      //
      // ■ 배열 (Array) — 목록 값 뒤에 점을 찍어 쓰는 기능
      //   map()  — 배열의 모든 항목에 함수를 적용하고, 그 결과들로 새 배열을 만듭니다. 원본은 바뀌지 않습니다.
      //       예) [1, 2].map(function (x) { return x * 2; }) → [2, 4]
      //   filter()  — 함수가 true 를 돌려주는 항목만 모아 새 배열을 만듭니다.
      //       예) [1, 2, 3].filter(function (x) { return x > 1; }) → [2, 3]
      //   join()  — 배열의 항목들을 구분자로 이어 붙여 하나의 문자열로 만듭니다.
      //       예) ["a", "b"].join(", ") → "a, b"
      //
      // ■ 숫자·날짜 (Math, Date)
      //   Math.round()  — 소수를 가장 가까운 정수로 반올림합니다.
      //       예) Math.round(2.6) → 3
      //   Date.now()  — 1970년 1월 1일부터 지금까지 흐른 시간을 밀리초(1/1000초)로 돌려줍니다. 경과 시간 계산에 씁니다.
      //
      // ■ JSON · 값 바꾸기 (변환)
      //   JSON.stringify()  — 객체를 JSON(데이터를 글자로 표현한 형식) 문자열로 바꿉니다. 화면과 서버가 데이터를 주고받을 때 씁니다.
      //       예) JSON.stringify({ a: 1 }) → '{"a":1}'
      //   res.json()  — fetch 로 받은 응답의 본문을 JSON 으로 해석해 객체로 돌려줍니다. 읽는 데 시간이 걸려서 await 와 함께 씁니다.
      //   String()  — 값을 문자열로 바꿉니다.
      //       예) String(5) → "5"
      //   encodeURIComponent()  — 한글·공백·특수문자를 주소(URL)에 안전하게 넣을 수 있는 %표기로 바꿉니다.
      //       예) encodeURIComponent("a b") → "a%20b"
      //
      // ■ 화면 요소 다루기 (브라우저 DOM)
      //   document.getElementById()  — 아이디(id)가 일치하는 요소를 찾아 돌려줍니다.
      //   closest()  — 자기 자신부터 시작해 부모 방향으로 올라가며, 선택자에 맞는 첫 요소를 찾습니다. 없으면 null 입니다.
      //       예) el.closest("header, nav") — 머리말/내비 안에 있는 요소인지 검사
      //   document.createElement()  — 새 HTML 요소를 만듭니다. 문서에 붙이기 전에는 화면에 나타나지 않습니다.
      //   appendChild()  — 요소를 다른 요소의 맨 끝 자식으로 붙입니다.
      //   remove()  — 요소를 문서에서 떼어 냅니다.
      //   select()  — 입력칸(textarea 등)의 내용을 전부 선택 상태로 만듭니다.
      //   document.execCommand()  — 문서에 명령을 실행합니다. 여기서는 copy(복사)에 씁니다. MDN 에서 사용 중단 예정(deprecated) 기능으로 표시되어 있어서, 새
      //       방식(clipboard)이 막힌 환경에서만 대비용으로 씁니다.
      //   addEventListener()  — 클릭·제출 같은 일이 생겼을 때 실행할 함수를 요소에 연결합니다.
      //   preventDefault()  — 이벤트의 기본 동작(예: 폼 제출 시 페이지 새로고침)을 막습니다.
      //   classList.add()  — 요소에 CSS 클래스를 붙입니다. 이미 있으면 그대로입니다.
      //   classList.remove()  — 요소에서 CSS 클래스를 뗍니다.
      //
      // ■ 브라우저 기본 기능 (시간, 서버 요청, 클립보드)
      //   fetch()  — 주소로 요청을 보내고 응답을 기다립니다. 응답이 올 때까지 시간이 걸려서 await 와 함께 씁니다.
      //   setTimeout()  — 지정한 시간(밀리초) 뒤에 함수를 한 번 실행합니다.
      //   setInterval()  — 지정한 간격(밀리초)마다 함수를 계속 실행합니다. 멈추려면 clearInterval 을 씁니다.
      //   clearInterval()  — setInterval 로 시작한 반복을 멈춥니다.
      //   clipboard.writeText()  — 글자를 클립보드에 복사합니다. 보안이 확보된 환경(https, localhost 등)에서만 허용됩니다.
      //
      // ■ 새로 만들기 (new)
      //   new Error  — 오류 값을 만듭니다. throw 와 함께 써서 오류를 일으킵니다.
      // ─────────────────────────────────────────────

      // $('url') 처럼 id로 요소를 찾는 줄임말 함수입니다. (document.getElementById)
      function $(id) {
        return document.getElementById(id);
      }
      // 글자를 안전하게 바꾸는 함수(HTML 이스케이프). & < > " ' 를 &amp; &lt; 같은 표시로 바꿉니다.
      // 외부 사이트에서 가져온 글에 <script> 같은 코드가 들어 있어도 "그냥 글자"로 보이게 하려는 것입니다.
      // 외부에서 온 글을 innerHTML에 넣기 전에는 반드시 거쳐야 합니다.
      // (s ?? '' : s가 비어 있으면(null/undefined) 빈 글자로 대신 씁니다)
      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      let current = null;

      // 화면 아래에 안내 문구를 1.5초(1500ms) 동안 보여 줍니다.
      // show 클래스를 붙이면 보이고(CSS opacity: 1), setTimeout이 1.5초 뒤 클래스를 뗍니다.
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(function () {
          return t.classList.remove("show");
        }, 1500);
      }

      // 글자를 클립보드에 복사합니다.
      // 1) 최신 방식 navigator.clipboard: 보안이 확보된 환경(https, localhost 등)에서만 허용됩니다.
      // 2) 막혀 있으면 catch에서 옛 방식 사용: 보이지 않는 입력칸(textarea)을 만들어 선택한 뒤 execCommand('copy') 실행.
      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        toast("복사했습니다");
      }

      // [원고 만들기] 제출 처리. async = 이 함수 안에서 await(끝날 때까지 기다리기)를 쓸 수 있다는 표시입니다.
      $("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const status = $("status");
        $("go").disabled = true;
        status.className = "status";
        status.textContent =
          "사이트를 열고 페이지별로 캡처하는 중입니다… 보통 1~2분 걸려요.";
        $("result").classList.remove("show");
        const started = Date.now();
        const timer = setInterval(function () {
          status.textContent = `사이트를 열고 페이지별로 캡처하는 중입니다… (${Math.round((Date.now() - started) / 1000)}초)`;
        }, 1000);
        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              url: $("url").value,
              maxPages: $("maxPages").value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "알 수 없는 오류");
          current = data;
          render(data);
          status.textContent = `완료! 결과 폴더: output/${data.id}`;
        } catch (err) {
          status.className = "status error";
          status.textContent = err.message;
        } finally {
          clearInterval(timer);
          $("go").disabled = false;
        }
      });

      // 서버에서 받은 결과를 화면에 그립니다.
      // { id, site, manuscript } = 받은 데이터에서 필요한 항목만 바로 꺼내 쓰는 문법(구조 분해)입니다.
      //   id = 결과 폴더 이름 / site = 사이트 분석 데이터 / manuscript = 원고(blocks: 화면용 블록, text: 복사용 평문)
      function render({id, site, manuscript}) {
        // 결과 폴더 안 파일의 주소를 만듭니다. encodeURIComponent 는 한글/공백이 있어도 주소로 안전하게 바꿔 줍니다.
        function img(f) {
          return `/output/${encodeURIComponent(id)}/${encodeURIComponent(f)}`;
        }
        let n = 0;
        $("post").innerHTML = manuscript.blocks
          .map(function (b) {
            if (b.type === "image") {
              n++;
              return `<figure>
        <img src="${img(b.file)}" alt="${esc(b.caption)}" loading="lazy">
        <figcaption><span class="num">이미지 ${n}</span> ${esc(b.caption)}
          · <a href="${img(b.file)}" download>첫 화면 저장</a>
          · <a href="${img(b.fullFile)}" target="_blank" rel="noopener">전체 페이지 보기</a></figcaption>
      </figure>`;
            }
            return `<p class="t">${esc(b.text).replace(
              /【[^】]*】/g,
              function (m) {
                return `<mark>${m}</mark>`;
              },
            )}</p>`;
          })
          .join("");

        const todos = (manuscript.text.match(/【[^】]*】/g) || []).length;
        $("todo").textContent = todos
          ? `노란색 【 】 ${todos}곳을 직접 채워 주세요`
          : "";
        $("zipLink").href = `/zip/${encodeURIComponent(id)}`;

        const slogans =
          site.sloganCandidates
            .map(function (s) {
              return `<button type="button" class="chip" data-copy="${esc(s.text)}">${esc(s.text)} <small>(${s.fontSize}px)</small></button>`;
            })
            .join("") || '<p class="err">찾지 못했습니다</p>';
        const colors = site.colors.accents
          .map(function (c) {
            return `<li class="swatch"><i style="background:${esc(c)}"></i>${esc(c)}</li>`;
          })
          .join("");
        const menu = site.pages
          .filter(function (p) {
            return !p.isHome;
          })
          .map(function (p) {
            return `<li>${esc(p.name)}${p.subs.length ? ` <small>(${esc(p.subs.join(", "))})</small>` : ""}${p.error ? ` <span class="err">캡처 실패: ${esc(p.error)}</span>` : ""}</li>`;
          })
          .join("");
        const pageTexts = site.pages
          .filter(function (p) {
            return !p.error;
          })
          .map(function (p) {
            return `<details><summary>${esc(p.name)}</summary>${
              [...p.headings, ...p.paragraphs]
                .map(function (t) {
                  return `<p>${esc(t)}</p>`;
                })
                .join("") || "<p>추출된 문구 없음</p>"
            }</details>`;
          })
          .join("");

        $("info").innerHTML = `
    <h3 class="sr-only" id="h-info">참고 정보</h3>
    <section class="card"><h4>고객사명 (추정)</h4><button type="button" class="chip" data-copy="${esc(manuscript.clientName)}">${esc(manuscript.clientName)}</button>
      <small style="color:var(--sub)">틀리면 원고에서 직접 고쳐 주세요</small></section>
    <section class="card"><h4>슬로건 후보 (클릭하면 복사)</h4>${slogans}</section>
    <section class="card"><h4>포인트 컬러 · 서체</h4>${colors ? `<ul class="swatches">${colors}</ul>` : '<p class="err">찾지 못했습니다</p>'}
      <p style="margin:8px 0 0;font-size:14px">${esc(site.fonts.join(", ") || "서체 정보 없음")}</p></section>
    <section class="card"><h4>메뉴 구성</h4>${menu ? `<ul class="menu">${menu}</ul>` : '<p class="err">메뉴를 찾지 못했습니다. 메인 화면만 캡처했어요.</p>'}</section>
    <section class="card"><h4>페이지별 추출 문구 (원고 다듬을 때 참고)</h4>${pageTexts}</section>`;

        $("result").classList.add("show");
      }

      // "원고 텍스트 복사" 버튼: 결과가 있을 때만(current &&) 원고 전체를 복사합니다.
      $("copyText").addEventListener("click", function () {
        return current && copy(current.manuscript.text);
      });
      // 오른쪽 패널 클릭 처리(이벤트 위임): 클릭된 곳이 data-copy 를 가진 버튼(또는 그 안쪽)이면 그 글을 복사합니다.
      // 버튼마다 따로 이벤트를 달지 않고 패널 하나에만 달아도 동작합니다. (패널 내용은 render()가 매번 새로 그리기 때문)
      $("info").addEventListener("click", function (e) {
        const b = e.target.closest("[data-copy]");
        if (b) copy(b.dataset.copy);
      });
    </script>
  </body>
</html>
