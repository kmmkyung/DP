<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그 원고 생성기</title>
    <!-- [이 파일의 역할] 기획자가 브라우저에서 보는 화면(입력창 + 결과 미리보기) 전체입니다. -->
    <!-- 구성: (1) index.css = 모양(CSS, 아래 link 태그로 불러옴), (2) body = 화면 뼈대(HTML), (3) 맨 아래 script = 동작(JavaScript). -->
    <!-- 서버(server.js)가 주소 / 로 접속한 사람에게 이 파일을, index.css 는 /index.css 요청에 내려줍니다. -->
    <!-- 모양(CSS)은 별도 파일 index.css 로 분리했습니다. -->
    <!-- href 를 "/index.css" 가 아니라 "index.css" 처럼 상대 경로로 적어서, 서버(npm start)로 열어도(주소 /) Live Server 로 열어도(주소 /blog-generator/public/index.html) 같은 폴더의 파일을 찾습니다. -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- main: 이 페이지의 핵심 내용 전체. 문서에서 하나만 둘 수 있고, 낭독기 사용자가 본문으로 바로 이동하는 기준점이 됩니다. 폭을 맞추는 틀(.wrap)은 안쪽 section 이 맡습니다. -->
    <main>
      <!-- section.wrap: 페이지 내용을 감싸는 구역이자 폭을 맞추는 틀(.wrap). aria-labelledby 로 제목(h1)을 이 구역의 이름으로 지정합니다. -->
      <section class="wrap" aria-labelledby="h-title">
        <!-- header: 페이지 머리말(제목과 한 줄 설명)을 묶습니다. -->
        <header>
          <h1 id="h-title">블로그 원고 생성기</h1>
          <p class="desc">
            제작한 홈페이지 주소를 넣으면 홍보 원고와 PC 화면 캡처를 만들어
            드립니다.
          </p>
        </header>

        <!-- [입력 영역] 주소를 입력하고 [원고 만들기]를 누르는 곳. 아래 id 값들은 script가 요소를 찾을 때 쓰는 이름표입니다. -->
        <!-- section: 의미 있는 한 구역. aria-labelledby 로 아래 숨은 제목(h2)을 이 구역의 이름으로 지정합니다. -->
        <section class="card" aria-labelledby="h-input">
          <!-- sr-only: 화면에는 안 보이고 낭독기만 읽는 제목. 제목 단계(h1, h2, h3)를 건너뛰지 않기 위해 둡니다. -->
          <h2 class="sr-only" id="h-input">주소 입력</h2>
          <form id="form">
            <!-- label: 입력칸의 이름표. placeholder 는 입력하면 사라지고 낭독기가 읽지 않으므로 label 을 대신할 수 없습니다. for 값이 입력칸 id 와 같아야 연결됩니다. -->
            <label for="url" class="sr-only">홈페이지 주소</label>
            <input
              type="text"
              id="url"
              placeholder="예) http://design.com"
              autocomplete="off"
              required />
            <!-- 캡처할 페이지 수(메인 포함). 선택값이 서버로 전달되고, 서버가 1~15 범위로 제한합니다. -->
            <label for="maxPages" class="sr-only"
              >캡처할 페이지 수 (메인 포함)</label
            >
            <select id="maxPages" title="캡처할 페이지 수 (메인 포함)">
              <option value="5">페이지 5개</option>
              <option value="8" selected>페이지 8개</option>
              <option value="12">페이지 12개</option>
            </select>
            <!-- type submit 이므로 누르거나 입력창에서 Enter를 치면 form 제출 이벤트가 발생합니다. 처리는 맨 아래 script의 submit 부분입니다. -->
            <button type="submit" class="primary" id="go">원고 만들기</button>
          </form>
          <!-- 진행 상황 또는 오류 문구가 표시되는 자리. output 은 "사용자 동작의 결과"를 넣는 태그이고, 암묵적으로 role=status 라서 내용이 바뀌면 낭독기가 읽어 줍니다. -->
          <output class="status" id="status"></output>
        </section>

        <!-- [결과 영역] 처음엔 숨김. 분석이 끝나면 script가 show 클래스를 붙여 보여 줍니다. -->
        <!-- section: 분석 결과 전체를 묶는 구역. 아래 숨은 h2 가 구역 이름입니다. (왼쪽 원고 + 오른쪽 참고 정보를 격자로 배치하는 틀 역할도 겸함) -->
        <section class="result" id="result" aria-labelledby="h-result">
          <h2 class="sr-only" id="h-result">분석 결과</h2>
          <!-- 왼쪽: 원고 미리보기. -->
          <section class="card" aria-labelledby="h-post">
            <!-- header: 이 구역의 머리말. 숨은 제목(h3)과 조작 버튼 목록, 안내 문구를 묶습니다. 제목은 h2(분석 결과) 아래 단계라 h3 입니다. -->
            <header class="toolbar">
              <h3 class="sr-only" id="h-post">원고 미리보기</h3>
              <!-- menu: 버튼처럼 "누르면 동작하는 항목"의 목록. li 와 함께 쓰며 브라우저는 ul 처럼 다룹니다. -->
              <menu>
                <li>
                  <button type="button" id="copyText">원고 텍스트 복사</button>
                </li>
                <!-- ZIP 다운로드 링크. href(주소)는 render()에서 결과 폴더에 맞게 채웁니다. 링크 안에 button 을 넣으면 HTML 규칙 위반이라, 링크에 btn 클래스를 붙여 버튼처럼 보이게 했습니다. -->
                <li>
                  <a id="zipLink" class="btn">이미지+원고 전체 다운로드(ZIP)</a>
                </li>
              </menu>
              <!-- 【 】를 채워야 하는 곳의 개수 안내 문구가 들어갑니다. -->
              <p class="todo" id="todo"></p>
            </header>
            <!-- 원고 블록(문단과 이미지)이 render()에서 여기에 채워집니다. article: 그 자체로 하나의 글(블로그 글처럼 독립된 내용)을 뜻하는 태그입니다. -->
            <article class="post" id="post"></article>
          </section>
          <!-- 오른쪽: 참고 정보 패널(고객사명, 슬로건 후보, 컬러, 메뉴, 추출 문구). render()에서 채워집니다. aside: 본문을 보조하는 곁다리 내용. 이름(h-info)은 render()가 만드는 숨은 제목입니다. -->
          <aside id="info" aria-labelledby="h-info"></aside>
        </section>
      </section>
    </main>
    <!-- 복사 완료 알림. toast() 함수가 잠깐 보였다가 숨깁니다. status 와 같은 이유로 output 태그를 씁니다. -->
    <output class="toast" id="toast"></output>

    <script>
      // ─────────────────────────────────────────────
      // [이 스크립트의 역할] 화면의 "동작"을 담당합니다.
      // 흐름: [원고 만들기] 제출 → 서버에 분석 요청(fetch) → 결과를 받아 render()로 화면에 그림
      // 이 코드는 서버가 아니라 "기획자의 브라우저 안"에서 실행됩니다. (서버 쪽 코드는 server.js)
      // ─────────────────────────────────────────────
      // $('url') 처럼 id로 요소를 찾는 줄임말 함수입니다. (document.getElementById)
      const $ = (id) => document.getElementById(id);
      // 글자를 안전하게 바꾸는 함수(HTML 이스케이프). & < > " ' 를 &amp; &lt; 같은 표시로 바꿉니다.
      // 외부 사이트에서 가져온 글에 <script> 같은 코드가 들어 있어도 "그냥 글자"로 보이게 하려는 것입니다.
      // 외부에서 온 글을 innerHTML에 넣기 전에는 반드시 거쳐야 합니다.
      // (s ?? '' : s가 비어 있으면(null/undefined) 빈 글자로 대신 씁니다)
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      // 가장 최근에 받은 분석 결과를 저장해 둡니다. ("원고 텍스트 복사" 버튼이 사용)
      let current = null;

      // 화면 아래에 안내 문구를 1.5초(1500ms) 동안 보여 줍니다.
      // show 클래스를 붙이면 보이고(CSS opacity: 1), setTimeout이 1.5초 뒤 클래스를 뗍니다.
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1500);
      }

      // 글자를 클립보드에 복사합니다.
      // 1) 최신 방식 navigator.clipboard: 보안이 확보된 환경(https, localhost 등)에서만 허용됩니다.
      // 2) 막혀 있으면 catch에서 옛 방식 사용: 보이지 않는 입력칸(textarea)을 만들어 선택한 뒤 execCommand('copy') 실행.
      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          // http 환경 등에서 clipboard API가 막힌 경우 대비
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        toast("복사했습니다");
      }

      // [원고 만들기] 제출 처리. async = 이 함수 안에서 await(끝날 때까지 기다리기)를 쓸 수 있다는 표시입니다.
      $("form").addEventListener("submit", async (e) => {
        // 폼의 기본 동작(페이지 새로고침)을 막습니다. 새로고침되면 화면이 초기화되므로 꼭 필요합니다.
        e.preventDefault();
        const status = $("status");
        $("go").disabled = true;
        status.className = "status";
        status.textContent =
          "사이트를 열고 페이지별로 캡처하는 중입니다… 보통 1~2분 걸려요.";
        $("result").classList.remove("show");
        // 경과 시간 표시용: 시작 시각을 기억해 두고, 1초마다 현재 시각과의 차이를 보여 줍니다.
        const started = Date.now();
        // 1초마다 "(N초)"를 갱신합니다. 오래 걸려도 멈춘 게 아니라는 걸 알려 줍니다. 끝나면 clearInterval로 멈춥니다.
        const timer = setInterval(() => {
          status.textContent = `사이트를 열고 페이지별로 캡처하는 중입니다… (${Math.round((Date.now() - started) / 1000)}초)`;
        }, 1000);
        try {
          // 서버에 분석을 요청합니다(POST). 보내는 데이터는 JSON 글자(JSON.stringify)입니다.
          // await = 응답이 올 때까지 기다립니다. (보통 1~2분)
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              url: $("url").value,
              maxPages: $("maxPages").value,
            }),
          });
          const data = await res.json();
          // 서버가 400/409/500 같은 오류 번호를 주면 res.ok 가 false 입니다. 오류로 던지면 아래 catch가 문구를 표시합니다.
          if (!res.ok) throw new Error(data.error || "알 수 없는 오류");
          current = data;
          render(data);
          status.textContent = `완료! 결과 폴더: output/${data.id}`;
        } catch (err) {
          status.className = "status error";
          status.textContent = err.message;
          // 성공이든 실패든 마지막에 항상 실행: 경과 시간 표시를 멈추고, 버튼을 다시 누를 수 있게 합니다.
        } finally {
          clearInterval(timer);
          $("go").disabled = false;
        }
      });

      // 서버에서 받은 결과를 화면에 그립니다.
      // { id, site, manuscript } = 받은 데이터에서 필요한 항목만 바로 꺼내 쓰는 문법(구조 분해)입니다.
      //   id = 결과 폴더 이름 / site = 사이트 분석 데이터 / manuscript = 원고(blocks: 화면용 블록, text: 복사용 평문)
      function render({id, site, manuscript}) {
        // 결과 폴더 안 파일의 주소를 만듭니다. encodeURIComponent 는 한글/공백이 있어도 주소로 안전하게 바꿔 줍니다.
        const img = (f) =>
          `/output/${encodeURIComponent(id)}/${encodeURIComponent(f)}`;
        // 이미지 번호 세기용 (이미지 1, 이미지 2 ...)
        let n = 0;
        // [왼쪽] 원고 미리보기: 원고 블록을 하나씩 HTML로 바꿔 이어 붙입니다.
        //  - 이미지 블록: 캡처 이미지 + 설명 + "첫 화면 저장 / 전체 페이지 보기" 링크
        //  - 글 블록: esc()로 안전하게 바꾼 "뒤에" 【 】 부분만 노란 mark로 감쌉니다. (순서가 바뀌면 안 됩니다)
        //  - loading="lazy": 화면에 가까워질 때 이미지를 불러와서 처음 표시가 빨라집니다.
        $("post").innerHTML = manuscript.blocks
          .map((b) => {
            if (b.type === "image") {
              n++;
              return `<figure>
        <img src="${img(b.file)}" alt="${esc(b.caption)}" loading="lazy">
        <figcaption><span class="num">이미지 ${n}</span> ${esc(b.caption)}
          · <a href="${img(b.file)}" download>첫 화면 저장</a>
          · <a href="${img(b.fullFile)}" target="_blank" rel="noopener">전체 페이지 보기</a></figcaption>
      </figure>`;
            }
            return `<p class="t">${esc(b.text).replace(/【[^】]*】/g, (m) => `<mark>${m}</mark>`)}</p>`;
          })
          .join("");

        // 【 】가 몇 곳 남았는지 세어서 안내합니다. (정규식: 【 로 시작해 】 로 끝나는 모든 부분)
        const todos = (manuscript.text.match(/【[^】]*】/g) || []).length;
        $("todo").textContent = todos
          ? `노란색 【 】 ${todos}곳을 직접 채워 주세요`
          : "";
        $("zipLink").href = `/zip/${encodeURIComponent(id)}`;

        // [오른쪽] 정보 패널에 들어갈 조각들을 만듭니다.
        // 슬로건 후보: 클릭하면 복사되도록 data-copy 속성에 글을 넣어 둡니다. (글자 크기도 함께 표시)
        const slogans =
          site.sloganCandidates
            .map(
              (s) =>
                `<button type="button" class="chip" data-copy="${esc(s.text)}">${esc(s.text)} <small>(${s.fontSize}px)</small></button>`,
            )
            .join("") || '<p class="err">찾지 못했습니다</p>';
        // 포인트 컬러 견본: 색 네모 + 색 코드
        const colors = site.colors.accents
          .map(
            (c) =>
              `<li class="swatch"><i style="background:${esc(c)}"></i>${esc(c)}</li>`,
          )
          .join("");
        // 메뉴 구성 목록(MAIN 제외). 캡처에 실패한 페이지는 빨간 오류 문구를 함께 보여 줍니다.
        const menu = site.pages
          .filter((p) => !p.isHome)
          .map(
            (p) =>
              `<li>${esc(p.name)}${p.subs.length ? ` <small>(${esc(p.subs.join(", "))})</small>` : ""}${p.error ? ` <span class="err">캡처 실패: ${esc(p.error)}</span>` : ""}</li>`,
          )
          .join("");
        // 페이지별로 추출한 제목/문구를 접었다 펴는 목록으로 만듭니다. (기획자가 원고를 다듬을 때 참고)
        const pageTexts = site.pages
          .filter((p) => !p.error)
          .map(
            (p) =>
              `<details><summary>${esc(p.name)}</summary>${[...p.headings, ...p.paragraphs].map((t) => `<p>${esc(t)}</p>`).join("") || "<p>추출된 문구 없음</p>"}</details>`,
          )
          .join("");

        // 위 조각들을 카드로 묶어 오른쪽 패널에 채웁니다.
        // 맨 앞의 숨은 제목(h3)은 aside 의 이름(aria-labelledby)이 되고, 카드 제목(h4)과 단계(h1 → h2 → h3 → h4)가 이어지게 합니다.
        // 카드는 각각 제목이 있는 독립된 묶음이라 div 가 아니라 section 으로 만듭니다.
        $("info").innerHTML = `
    <h3 class="sr-only" id="h-info">참고 정보</h3>
    <section class="card"><h4>고객사명 (추정)</h4><button type="button" class="chip" data-copy="${esc(manuscript.clientName)}">${esc(manuscript.clientName)}</button>
      <small style="color:var(--sub)">틀리면 원고에서 직접 고쳐 주세요</small></section>
    <section class="card"><h4>슬로건 후보 (클릭하면 복사)</h4>${slogans}</section>
    <section class="card"><h4>포인트 컬러 · 서체</h4>${colors ? `<ul class="swatches">${colors}</ul>` : '<p class="err">찾지 못했습니다</p>'}
      <p style="margin:8px 0 0;font-size:14px">${esc(site.fonts.join(", ") || "서체 정보 없음")}</p></section>
    <section class="card"><h4>메뉴 구성</h4>${menu ? `<ul class="menu">${menu}</ul>` : '<p class="err">메뉴를 찾지 못했습니다. 메인 화면만 캡처했어요.</p>'}</section>
    <section class="card"><h4>페이지별 추출 문구 (원고 다듬을 때 참고)</h4>${pageTexts}</section>`;

        // 숨겨 두었던 결과 영역을 보이게 합니다. (CSS의 .result.show)
        $("result").classList.add("show");
      }

      // "원고 텍스트 복사" 버튼: 결과가 있을 때만(current &&) 원고 전체를 복사합니다.
      $("copyText").addEventListener(
        "click",
        () => current && copy(current.manuscript.text),
      );
      // 오른쪽 패널 클릭 처리(이벤트 위임): 클릭된 곳이 data-copy 를 가진 버튼(또는 그 안쪽)이면 그 글을 복사합니다.
      // 버튼마다 따로 이벤트를 달지 않고 패널 하나에만 달아도 동작합니다. (패널 내용은 render()가 매번 새로 그리기 때문)
      $("info").addEventListener("click", (e) => {
        const b = e.target.closest("[data-copy]");
        if (b) copy(b.dataset.copy);
      });
    </script>
  </body>
</html>
