<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 원고 생성기</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --line: #e3e5e9; --text: #1d2129; --sub: #6b7280;
    --brand: #03c75a; --brand-dark: #02a84b; --mark: #fff3b0; --err: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .desc { color: var(--sub); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 320px; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
  select, button { padding: 12px 14px; font-size: 15px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
  button.primary:hover { background: var(--brand-dark); }
  button:disabled { opacity: .5; cursor: wait; }
  .status { margin-top: 12px; color: var(--sub); min-height: 1.6em; }
  .status.error { color: var(--err); }
  .result { display: none; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; margin-top: 20px; align-items: start; }
  .result.show { display: grid; }
  @media (max-width: 960px) { .result.show { grid-template-columns: 1fr; } }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar .todo { margin-left: auto; color: var(--sub); font-size: 14px; }
  .post { max-width: 720px; margin: 0 auto; }
  .post .t { white-space: pre-line; margin: 0 0 36px; text-align: center; }
  .post .t mark { background: var(--mark); padding: 0 2px; }
  .post figure { margin: 0 0 36px; text-align: center; }
  .post figure img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
  .post figcaption { font-size: 13px; color: var(--sub); margin-top: 6px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .post figcaption a { color: var(--sub); }
  .num { display: inline-block; background: var(--text); color: #fff; border-radius: 4px; padding: 0 6px; font-size: 12px; }
  aside .card + .card { margin-top: 12px; }
  aside h3 { font-size: 14px; margin: 0 0 8px; color: var(--sub); }
  .chip { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 0 0 6px; font-size: 14px; background: #fafafa; }
  .chip small { color: var(--sub); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { display: flex; align-items: center; gap: 6px; font-size: 13px; font-family: monospace; }
  .swatch i { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
  ul.menu { margin: 0; padding-left: 18px; font-size: 14px; }
  ul.menu small { color: var(--sub); }
  details { font-size: 13px; border-top: 1px solid var(--line); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  details p { margin: 4px 0; color: #444; }
  .err { color: var(--err); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>블로그 원고 생성기</h1>
  <p class="desc">제작한 홈페이지 주소를 넣으면 네이버 블로그 홍보 원고와 PC 화면 캡처를 만들어 드립니다.</p>

  <div class="card">
    <form id="form">
      <input type="text" id="url" placeholder="예) http://daehye.com" autocomplete="off" required>
      <select id="maxPages" title="캡처할 페이지 수 (메인 포함)">
        <option value="5">페이지 5개</option>
        <option value="8" selected>페이지 8개</option>
        <option value="12">페이지 12개</option>
      </select>
      <button type="submit" class="primary" id="go">원고 만들기</button>
    </form>
    <div class="status" id="status"></div>
  </div>

  <div class="result" id="result">
    <section class="card">
      <div class="toolbar">
        <button type="button" id="copyText">원고 텍스트 복사</button>
        <a id="zipLink"><button type="button">이미지+원고 전체 다운로드(ZIP)</button></a>
        <span class="todo" id="todo"></span>
      </div>
      <div class="post" id="post"></div>
    </section>
    <aside id="info"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let current = null;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // http 환경 등에서 clipboard API가 막힌 경우 대비
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('복사했습니다');
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = $('status');
  $('go').disabled = true;
  status.className = 'status';
  status.textContent = '사이트를 열고 페이지별로 캡처하는 중입니다… 보통 1~2분 걸려요.';
  $('result').classList.remove('show');
  const started = Date.now();
  const timer = setInterval(() => {
    status.textContent = `사이트를 열고 페이지별로 캡처하는 중입니다… (${Math.round((Date.now() - started) / 1000)}초)`;
  }, 1000);
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value, maxPages: $('maxPages').value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '알 수 없는 오류');
    current = data;
    render(data);
    status.textContent = `완료! 결과 폴더: output/${data.id}`;
  } catch (err) {
    status.className = 'status error';
    status.textContent = err.message;
  } finally {
    clearInterval(timer);
    $('go').disabled = false;
  }
});

function render({ id, site, manuscript }) {
  const img = (f) => `/output/${encodeURIComponent(id)}/${encodeURIComponent(f)}`;
  let n = 0;
  $('post').innerHTML = manuscript.blocks.map((b) => {
    if (b.type === 'image') {
      n++;
      return `<figure>
        <img src="${img(b.file)}" alt="${esc(b.caption)}" loading="lazy">
        <figcaption><span class="num">이미지 ${n}</span> ${esc(b.caption)}
          · <a href="${img(b.file)}" download>첫 화면 저장</a>
          · <a href="${img(b.fullFile)}" target="_blank" rel="noopener">전체 페이지 보기</a></figcaption>
      </figure>`;
    }
    return `<p class="t">${esc(b.text).replace(/【[^】]*】/g, (m) => `<mark>${m}</mark>`)}</p>`;
  }).join('');

  const todos = (manuscript.text.match(/【[^】]*】/g) || []).length;
  $('todo').textContent = todos ? `노란색 【 】 ${todos}곳을 직접 채워 주세요` : '';
  $('zipLink').href = `/zip/${encodeURIComponent(id)}`;

  const slogans = site.sloganCandidates.map((s) =>
    `<button type="button" class="chip" data-copy="${esc(s.text)}">${esc(s.text)} <small>(${s.fontSize}px)</small></button>`).join('') || '<p class="err">찾지 못했습니다</p>';
  const colors = site.colors.accents.map((c) => `<span class="swatch"><i style="background:${esc(c)}"></i>${esc(c)}</span>`).join('');
  const menu = site.pages.filter((p) => !p.isHome).map((p) =>
    `<li>${esc(p.name)}${p.subs.length ? ` <small>(${esc(p.subs.join(', '))})</small>` : ''}${p.error ? ` <span class="err">캡처 실패: ${esc(p.error)}</span>` : ''}</li>`).join('');
  const pageTexts = site.pages.filter((p) => !p.error).map((p) =>
    `<details><summary>${esc(p.name)}</summary>${[...p.headings, ...p.paragraphs].map((t) => `<p>${esc(t)}</p>`).join('') || '<p>추출된 문구 없음</p>'}</details>`).join('');

  $('info').innerHTML = `
    <div class="card"><h3>고객사명 (추정)</h3><button type="button" class="chip" data-copy="${esc(manuscript.clientName)}">${esc(manuscript.clientName)}</button>
      <small style="color:var(--sub)">틀리면 원고에서 직접 고쳐 주세요</small></div>
    <div class="card"><h3>슬로건 후보 (클릭하면 복사)</h3>${slogans}</div>
    <div class="card"><h3>포인트 컬러 · 서체</h3><div class="swatches">${colors || '<span class="err">찾지 못했습니다</span>'}</div>
      <p style="margin:8px 0 0;font-size:14px">${esc(site.fonts.join(', ') || '서체 정보 없음')}</p></div>
    <div class="card"><h3>메뉴 구성</h3>${menu ? `<ul class="menu">${menu}</ul>` : '<p class="err">메뉴를 찾지 못했습니다. 메인 화면만 캡처했어요.</p>'}</div>
    <div class="card"><h3>페이지별 추출 문구 (원고 다듬을 때 참고)</h3>${pageTexts}</div>`;

  $('result').classList.add('show');
}

$('copyText').addEventListener('click', () => current && copy(current.manuscript.text));
$('info').addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]');
  if (b) copy(b.dataset.copy);
});
</script>
</body>
</html>
